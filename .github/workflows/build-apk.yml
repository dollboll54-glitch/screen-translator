name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Prepare Project
        run: |
          echo "Files in repo:"
          ls -la
          
          # Unzip any zip file found
          for f in *; do
            if [[ "$f" == *"ScreenTranslator"* ]] || [[ "$f" == *".zip"* ]]; then
              echo "Extracting: $f"
              unzip -o "$f" || python3 -m zipfile -e "$f" .
            fi
          done

          # Set Android SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Create themes.xml to prevent AAPT2 style error
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.ScreenTranslator" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#2563EB</item>
                  <item name="android:statusBarColor">#0F172A</item>
              </style>
          </resources>
          EOF

          ls -la app/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Debug-APK
          path: "**/outputs/apk/debug/*.apk"
          retention-days: 14
