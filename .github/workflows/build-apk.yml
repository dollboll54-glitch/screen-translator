name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Prepare Project
        run: |
          echo "Files in repo:"
          ls -la
          
          # Unzip any zip file found
          for f in *; do
            if [[ "$f" == *"ScreenTranslator"* ]] || [[ "$f" == *".zip"* ]]; then
              echo "Extracting: $f"
              unzip -o "$f" || python3 -m zipfile -e "$f" .
            fi
          done

          # Set Android SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Create themes.xml
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.ScreenTranslator" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#2563EB</item>
                  <item name="android:statusBarColor">#0F172A</item>
              </style>
          </resources>
          EOF

          # Create default bg_bubble_circle drawable
          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/bg_bubble_circle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#2563EB" />
              <stroke android:width="2dp" android:color="#60A5FA" />
          </shape>
          EOF

          # Fix missing icon reference in manifest
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@android:drawable/sym_def_app_icon"|g' app/src/main/AndroidManifest.xml
            sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"||g' app/src/main/AndroidManifest.xml
          fi

          # Ensure cardview dependency is present
          if [ -f "app/build.gradle" ]; then
            if ! grep -q "cardview" app/build.gradle; then
              sed -i "s|dependencies {|dependencies {\n    implementation 'androidx.cardview:cardview:1.0.0'|g" app/build.gradle
            fi
          fi

          # 1. বাবল ছোট (৩৮dp) এবং ৪৫% হালকা স্বচ্ছ করা
          cat << 'EOF' > app/src/main/res/layout/layout_floating_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:padding="2dp">
              <ImageView
                  android:id="@+id/bubble_icon"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:alpha="0.45"
                  android:src="@android:drawable/ic_menu_search"
                  android:tint="#FFFFFF"
                  android:background="@drawable/bg_bubble_circle"
                  android:padding="8dp"
                  android:elevation="4dp"
                  android:contentDescription="Translator Bubble" />
          </FrameLayout>
          EOF

          # 2. bKash ও বড় মেসেজের জন্য ডুয়াল ট্রান্সলেশন ইঞ্জিন সেট করা
          cat << 'EOF' > app/src/main/java/com/screentranslator/app/TranslationEngine.kt
          package com.screentranslator.app

          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URLEncoder
          import java.util.concurrent.TimeUnit

          object TranslationEngine {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(5, TimeUnit.SECONDS)
                  .readTimeout(8, TimeUnit.SECONDS)
                  .build()

              fun translateEnToBn(sourceText: String): String {
                  val cleanText = sourceText.trim()
                  if (cleanText.isEmpty()) return ""

                  val googleResult = tryGoogleTranslate(cleanText)
                  if (!googleResult.isNullOrBlank()) return googleResult

                  val backupResult = tryMyMemoryTranslate(cleanText)
                  if (!backupResult.isNullOrBlank()) return backupResult

                  return "অনুবাদ সম্পন্ন করা যায়নি"
              }

              private fun tryGoogleTranslate(text: String): String? {
                  return try {
                      val encoded = URLEncoder.encode(text, "UTF-8")
                      val url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=bn&dt=t&q=$encoded"
                      val req = Request.Builder().url(url).header("User-Agent", "Mozilla/5.0 (Linux; Android 10)").build()
                      val res = client.newCall(req).execute()
                      val body = res.body?.string() ?: return null
                      if (!body.startsWith("[")) return null
                      val jsonArray = JSONArray(body)
                      val sentences = jsonArray.optJSONArray(0) ?: return null
                      val sb = StringBuilder()
                      for (i in 0 until sentences.length()) {
                          val item = sentences.optJSONArray(i)
                          if (item != null && item.length() > 0) {
                              val part = item.optString(0)
                              if (part.isNotEmpty() && part != "null") sb.append(part)
                          }
                      }
                      if (sb.isNotEmpty()) sb.toString() else null
                  } catch (e: Exception) { null }
              }

              private fun tryMyMemoryTranslate(text: String): String? {
                  return try {
                      val encoded = URLEncoder.encode(text, "UTF-8")
                      val url = "https://api.mymemory.translated.net/get?q=$encoded&langpair=en|bn"
                      val req = Request.Builder().url(url).header("User-Agent", "Mozilla/5.0").build()
                      val res = client.newCall(req).execute()
                      val body = res.body?.string() ?: return null
                      val json = JSONObject(body)
                      val resData = json.optJSONObject("responseData")
                      val translated = resData?.optString("translatedText")
                      if (!translated.isNullOrBlank() && !translated.startsWith("MYMEMORY WARNING")) translated else null
                  } catch (e: Exception) { null }
              }
          }
          EOF

          # 3. স্পিকারে মিষ্টি বাংলায় পড়ে শোনানো সেট করা
          cat << 'EOF' > app/src/main/java/com/screentranslator/app/OverlayResultWindow.kt
          package com.screentranslator.app

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.PixelFormat
          import android.os.Build
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.widget.ImageView
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Locale

          object OverlayResultWindow {
              private var popupView: View? = null
              private var windowManager: WindowManager? = null
              private var tts: TextToSpeech? = null

              fun show(context: Context, wm: WindowManager, originalText: String, translatedText: String, targetX: Int, targetY: Int) {
                  dismiss()
                  this.windowManager = wm
                  val inflater = LayoutInflater.from(context)
                  popupView = inflater.inflate(R.layout.layout_translation_overlay_card, null)

                  val layoutFlag = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutFlag,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = Math.max(100, targetY - 120)
                  }

                  popupView?.findViewById<TextView>(R.id.tv_original_text)?.text = originalText
                  popupView?.findViewById<TextView>(R.id.tv_translated_text)?.text = translatedText

                  popupView?.findViewById<ImageView>(R.id.btn_close_overlay)?.setOnClickListener { dismiss() }

                  popupView?.findViewById<ImageView>(R.id.btn_copy_translation)?.setOnClickListener {
                      val clip = ClipData.newPlainText("Translation", translatedText)
                      (context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(clip)
                      Toast.makeText(context, "কপি করা হয়েছে!", Toast.LENGTH_SHORT).show()
                  }

                  popupView?.findViewById<ImageView>(R.id.btn_speak_text)?.setOnClickListener {
                      val textToSpeak = if (!translatedText.isNullOrBlank() && !translatedText.contains("সমস্যা")) translatedText else originalText
                      if (tts == null) {
                          tts = TextToSpeech(context) { status ->
                              if (status == TextToSpeech.SUCCESS) {
                                  val r = tts?.setLanguage(Locale("bn", "BD"))
                                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) tts?.language = Locale("bn")
                                  tts?.speak(textToSpeak, TextToSpeech.QUEUE_FLUSH, null, "tts_bn")
                              }
                          }
                      } else {
                          val r = tts?.setLanguage(Locale("bn", "BD"))
                          if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) tts?.language = Locale("bn")
                          tts?.speak(textToSpeak, TextToSpeech.QUEUE_FLUSH, null, "tts_bn")
                      }
                  }

                  wm.addView(popupView, params)
              }

              fun dismiss() {
                  try {
                      popupView?.let { windowManager?.removeView(it); popupView = null }
                      tts?.shutdown()
                      tts = null
                  } catch (e: Exception) {}
              }
          }
          EOF

          ls -la app/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Debug-APK
          path: "**/outputs/apk/debug/*.apk"
          retention-days: 14
