name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          echo "Repository files:"
          ls -la
          
          # Find zip file even with (1), (2), (3) or spaces in name
          ZIP_FILE=$(find . -maxdepth 1 -type f \( -name "*ScreenTranslator*" -o -name "*.zip" \) | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE" || python3 -m zipfile -e "$ZIP_FILE" .
          fi
          
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Debug-APK
          path: "**/outputs/apk/debug/*.apk"
          retention-days: 14
